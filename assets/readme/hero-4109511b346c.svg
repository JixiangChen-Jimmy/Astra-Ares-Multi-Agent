<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Astra-Ares</title>
  <desc id="desc">Adaptive Reasoning Effort Selection. Let the task set the thinking depth. An illustrative sequence of low, high, and medium reasoning effort.</desc>
  <rect width="1200" height="400" rx="24" fill="#111111"/>
  <rect x="1" y="1" width="1198" height="398" rx="23" fill="none" stroke="#363636"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="58" y="72" fill="#f5f5f5" font-size="16" font-weight="600" letter-spacing="3">ADAPTIVE REASONING EFFORT SELECTION</text>
    <text x="54" y="173" fill="#f5f5f5" font-size="84" font-weight="650" letter-spacing="-4">Astra-Ares</text>
    <text x="58" y="224" fill="#c9c9c9" font-size="26">Let the task set the thinking depth.</text>
    <text x="58" y="345" fill="#bcbcbc" font-size="17">Native Codex CLI</text>
    <circle cx="224" cy="339" r="3" fill="#656565"/>
    <text x="243" y="345" fill="#bcbcbc" font-size="17">Powered by Jev</text>
    <rect x="712" y="66" width="428" height="274" rx="16" fill="#181818" stroke="#363636"/>
    <text x="739" y="105" fill="#bcbcbc" font-size="13" letter-spacing="2">EFFORT THROUGH A TASK</text>
    <path d="M744 275H1110" fill="none" stroke="#363636"/>
    <path d="M753 249H849V173H991V214H1100" fill="none" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="849" cy="173" r="5" fill="#f5f5f5"/>
    <circle cx="991" cy="214" r="5" fill="#f5f5f5"/>
    <text x="770" y="235" fill="#c9c9c9" font-size="16">LOW</text>
    <text x="891" y="157" fill="#f5f5f5" font-size="16">HIGH</text>
    <text x="1007" y="198" fill="#c9c9c9" font-size="16">MEDIUM</text>
    <text x="744" y="309" fill="#bcbcbc" font-size="13">Illustration · Jev chooses effort and duration</text>
  </g>
